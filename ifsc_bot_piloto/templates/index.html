<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chatbot IFSC Garopaba</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; display: flex; justify-content: center; padding: 30px; }
  #chat-container { width: 420px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); overflow: hidden; }
  #chat-header { background: #0b5d3b; color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
  #chat-header .titulo { font-weight: bold; font-size: 14px; }
  .pln-switch-area { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #b7cfc2; transition: .2s; border-radius: 20px; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
  .switch input:checked + .slider { background-color: #ffffff; }
  .switch input:checked + .slider:before { transform: translateX(18px); background-color: #0b5d3b; }
  #chat-box { height: 460px; overflow-y: auto; padding: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
  .msg a { color: #0b5d3b; text-decoration: underline; word-break: break-all; }
  .user a { color: #cfe9db; }
  .bot { background: #e6f4ea; align-self: flex-start; }
  .user { background: #0b5d3b; color: #fff; margin-left: auto; }
  .meta { font-size: 10px; color: #888; margin: -4px 0 8px 4px; align-self: flex-start; }
  .feedback-area { align-self: flex-start; margin: -4px 0 10px 4px; display: flex; flex-direction: column; gap: 6px; max-width: 85%; }
  .feedback-pergunta { font-size: 12px; color: #555; }
  .feedback-botoes { display: flex; gap: 8px; }
  .feedback-botoes button { border: 1px solid #0b5d3b; background: #fff; color: #0b5d3b; padding: 5px 14px; border-radius: 14px; font-size: 12px; cursor: pointer; }
  .feedback-botoes button:hover { background: #0b5d3b; color: #fff; }
  .feedback-obrigado { font-size: 12px; color: #888; font-style: italic; }
  .btn-atendente { align-self: flex-start; border: none; background: #b85450; color: #fff; padding: 6px 14px; border-radius: 14px; font-size: 12px; cursor: pointer; margin: 0; }
  .btn-atendente:hover { background: #9c3f3c; }
  #chat-box { display: flex; flex-direction: column; }
  #chat-input-area { display: flex; border-top: 1px solid #ddd; }
  #chat-input { flex: 1; border: none; padding: 12px; font-size: 14px; }
  #chat-send { border: none; background: #0b5d3b; color: #fff; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>

<div id="chat-container">
  <div id="chat-header">
    <div class="titulo">Secretaria Acadêmica - IFSC Garopaba</div>
    <div class="pln-switch-area">
      <span>PLN</span>
      <label class="switch">
        <input type="checkbox" id="pln-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div id="chat-box"></div>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Digite sua mensagem..." autofocus>
    <button id="chat-send">Enviar</button>
  </div>
</div>

<script>
// O identificador (aleatório, sem dados pessoais) é guardado no navegador para que a
// mesma pessoa continue no mesmo grupo do piloto se recarregar a página.
function obterUserId() {
  try {
    const salvo = localStorage.getItem("ifsc_chat_user_id");
    if (salvo && /^[A-Za-z0-9_-]{4,64}$/.test(salvo)) return salvo;
    const novo = "web-" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
    localStorage.setItem("ifsc_chat_user_id", novo);
    return novo;
  } catch (e) {
    return "web-" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  }
}
const USER_ID = obterUserId();
let PILOTO = false;   // vira true se o servidor estiver em modo piloto
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");
const plnToggle = document.getElementById("pln-toggle");

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, (url) => {
    // remove pontuação final que às vezes gruda no link (. , ) etc)
    const cleanUrl = url.replace(/[.,)]+$/, "");
    return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>`;
  });
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  if (sender === "bot") {
    div.innerHTML = linkify(escapeHtml(text));
  } else {
    div.textContent = text;
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addMeta(modo, intent, confidence) {
  if (!modo || PILOTO) return;   // no piloto, a pessoa não vê qual modo está usando
  const div = document.createElement("div");
  div.className = "meta";
  let texto = "Modo: " + modo;
  if (intent) {
    texto += " | Intenção: " + intent;
    if (confidence !== null && confidence !== undefined) {
      texto += " (" + Math.round(confidence * 100) + "%)";
    }
  }
  div.textContent = texto;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function startChat() {
  const res = await fetch("/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: USER_ID })
  });
  const data = await res.json();
  if (data.piloto) {
    PILOTO = true;
    const area = document.querySelector(".pln-switch-area");
    if (area) area.style.display = "none";   // o servidor sorteia o modo
  }
  addMessage(data.reply || data.error, "bot");
}

// Comando interno que o backend entende como "quero falar com atendente",
// em qualquer ponto do menu (precisa ser igual a bot.COMANDO_ATENDENTE).
const COMANDO_ATENDENTE = "__atendente__";

// Mostra "Isso resolveu sua dúvida?" com os botões Sim / Não.
function addFeedback(demandaId) {
  const area = document.createElement("div");
  area.className = "feedback-area";
  area.innerHTML =
    '<div class="feedback-pergunta">Isso resolveu sua dúvida?</div>' +
    '<div class="feedback-botoes">' +
    '<button type="button" data-resposta="sim">Sim</button>' +
    '<button type="button" data-resposta="nao">Não</button>' +
    '</div>';
  area.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      responderFeedback(area, demandaId, btn.dataset.resposta === "sim");
    });
  });
  chatBox.appendChild(area);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function responderFeedback(area, demandaId, resolvido) {
  // Desativa os botões na hora para a pessoa não clicar duas vezes.
  area.querySelectorAll("button").forEach((b) => { b.disabled = true; });

  try {
    await fetch("/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID, demanda_id: demandaId, resolvido: resolvido })
    });
  } catch (erro) {
    console.error("Não foi possível registrar o feedback:", erro);
  }

  if (resolvido) {
    area.innerHTML = '<div class="feedback-obrigado">Que bom! Obrigado pelo feedback.</div>';
  } else {
    area.innerHTML = '<div class="feedback-obrigado">Sinto muito não ter conseguido ajudar. Obrigado pelo feedback.</div>';
    const btnAtendente = document.createElement("button");
    btnAtendente.type = "button";
    btnAtendente.className = "btn-atendente";
    btnAtendente.textContent = "Falar com atendente";
    btnAtendente.addEventListener("click", () => {
      btnAtendente.remove();
      enviarTexto("Falar com atendente", COMANDO_ATENDENTE);
    });
    area.appendChild(btnAtendente);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

// textoExibido = o que aparece no balão da pessoa;
// textoEnviado = o que realmente vai para o servidor.
async function enviarTexto(textoExibido, textoEnviado) {
  addMessage(textoExibido, "user");

  let data;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID, message: textoEnviado, usar_pln: plnToggle.checked })
    });
    data = await res.json();
  } catch (erro) {
    data = { error: "Não foi possível falar com o servidor agora. Tente novamente em instantes." };
  }
  addMessage(data.reply || data.error, "bot");
  addMeta(data.modo, data.intent, data.confidence);

  if (data.pedir_feedback && data.demanda_id) {
    addFeedback(data.demanda_id);
  }
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  enviarTexto(text, text);
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

startChat();
</script>

</body>
</html>
